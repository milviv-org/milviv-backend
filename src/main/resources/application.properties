# Database Configuration
db.url=jdbc:postgresql://localhost:5432/milviv
db.username=postgres
db.password=postgres
db.pool.size=10
db.connection.timeout=30000

# HTTP Server Configuration
server.port=8080
server.host=0.0.0.0

# Application Configuration
app.name=MILVIV
app.version=1.0.0
app.environment=development

# Logging Configuration
logging.level=INFO
logging.file.path=logs/application.log

# AI Assistant — лимиты (дефолты; см. docs/architecture/arc42/concepts/ai-assistant/limits-and-security.md)
ai.provider=none
# ai.model= задаётся явно при ai.provider=gemini; GEMINI_API_KEY — только env или .env
ai.gemini.base.url=https://generativelanguage.googleapis.com
ai.max.output.tokens=8192
ai.temperature=0.4
ai.connect.timeout.ms=5000
ai.call.timeout.ms=30000
ai.transport.retries=2
ai.response.max.bytes=65536
ai.message.max.length=2000
ai.user.requests.per.day=20
ai.user.requests.per.minute=3
ai.max.calls.per.request=4
ai.request.timeout.ms=90000
ai.plan.ttl.hours=24
ai.max.created.per.day=200
ai.quota.breaker.minutes=60
ai.max.data.rounds=2
ai.max.data.requests.per.round=3
ai.data.max.items=100
ai.data.text.max.length=1000
ai.data.max.tokens=16000
ai.max.creates=40
ai.max.updates=20
ai.max.deletes=10
ai.max.projects=10
ai.max.tasks.per.node=10
ai.max.tasks.total=30
ai.max.rewards=3
ai.title.max.length=100
ai.description.max.length=1000
ai.summary.max.length=500
ai.answer.max.length=2000
ai.clarification.max.length=300
ai.data.request.reason.max.length=200
ai.date.horizon.years=2
ai.reward.cost.max=100000
ai.memory.max.items=20
ai.memory.max.length=500
